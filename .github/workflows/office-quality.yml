name: COCCE Office quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: office-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript and production bundle
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Component and unit tests
        run: pnpm exec vitest run --maxWorkers=1 --testTimeout=15000
