name: Keep main as the only working branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-main-only
  cancel-in-progress: false

jobs:
  remove-non-main-branches:
    name: Remove obsolete non-main branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GH_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [[ "${branch}" == "main" ]]; then
              continue
            fi
            echo "Deleting obsolete branch: ${branch}"
            gh api --method DELETE "repos/${GH_REPOSITORY}/git/refs/heads/${branch}"
          done
          echo "Branch cleanup complete. main is the only retained branch."
