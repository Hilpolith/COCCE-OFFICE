name: COCCE Office sector validation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/office-sector-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/office-sector-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-sector-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - name: Install PostgreSQL 16 for isolated schema suites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit, integration, and sector acceptance suites
        run: pnpm test
      - name: Verify production TypeScript and Vite build
        run: pnpm build
