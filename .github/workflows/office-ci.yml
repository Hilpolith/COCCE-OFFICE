name: COCCE Office verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, SQL validators and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install PostgreSQL 16 for isolated SQL validation
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          pg_config --version
          pg_config --bindir
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest, API/security checks and disposable PostgreSQL suites
        run: pnpm test
      - name: Type-check and build
        run: pnpm build
